# Build backend image → Docker Hub → trigger Render redeploy.
#
# Secrets (GitHub → Settings → Secrets):
#   DOCKERHUB_USERNAME   — Docker Hub user/org
#   DOCKERHUB_TOKEN      — Docker Hub access token (not password)
#   RENDER_DEPLOY_HOOK   — optional; Render Dashboard → Service → Settings → Deploy Hook URL
#
# Render: create a Web Service with "Deploy an existing image from a registry"
#   Image: docker.io/<DOCKERHUB_USERNAME>/algotrace-backend:latest
#   Health check path: /healthz

name: Backend Docker Hub

on:
  push:
    branches: [main, master]
    # Run on any backend/infra change; ignore pure frontend/docs pushes (Vercel handles those).
    paths-ignore:
      - "frontend/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: # Actions → Backend Docker Hub → Run workflow

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/algotrace-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set — skip (add Deploy Hook URL secret, or turn on Render auto-deploy from Docker Hub)."
            exit 0
          fi
          echo "Calling Render deploy hook…"
          curl -fsS -X POST "$HOOK"
          echo
          echo "Render deploy triggered."
